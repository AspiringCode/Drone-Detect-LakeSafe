<style>
  :root { --ink: #111827; --muted: #6b7280; --accent: #2563eb; --water: #e7effd; --water-2: #f3f7fe; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: "IBM Plex Sans", "Segoe UI", sans-serif; }
  nav { max-width: 1328px; margin: 0 auto; padding: 16px 24px 0; display: flex; flex-wrap: wrap; gap: 24px; }
  nav a { font-size: 14px; color: var(--muted); text-decoration: none; padding: 6px 0; border-bottom: 2px solid transparent; }
  nav a:hover { color: var(--ink); }
  nav a[aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  main { max-width: 1328px; margin: 0 auto; padding: 8px 24px 32px; }
  section { display: none; }
  section.on { display: block; }
  section svg { width: 100%; height: auto; display: block; background: #fff; }
  body.export nav { display: none; }
  body.export main { padding: 0; max-width: none; }
  body.export section svg { width: 1280px; height: 720px; }

  svg text { fill: var(--ink); font-family: "IBM Plex Sans", "Segoe UI", sans-serif; }
  .h1 { font-size: 28px; font-weight: 600; }
  .col { font-size: 15px; font-weight: 600; fill: var(--muted); }
  .t { font-size: 14px; font-weight: 500; }
  .tl { font-size: 17px; font-weight: 600; }
  .b { font-size: 13px; fill: var(--muted); }
  .s { font-size: 12px; fill: var(--muted); }
  .k { font-weight: 700; }
  .box { fill: #fff; stroke: var(--ink); stroke-width: 1.25; }
  .key { fill: #fff; stroke: var(--ink); stroke-width: 2.75; }
  .ln { fill: none; stroke: var(--ink); stroke-width: 1.25; marker-end: url(#arr); }
  .ln-acc { fill: none; stroke: var(--accent); stroke-width: 2; marker-end: url(#arr-acc); }
  .rail { fill: none; stroke: var(--ink); stroke-width: 1.25; }
  .life { stroke: #d1d5db; stroke-width: 1; }
  .acc { fill: var(--accent) !important; }
  .dot { fill: var(--ink); }
  .dot-t { font-size: 11px; font-weight: 600; fill: #fff; }
  a { cursor: pointer; }
  a:hover .key, a:hover .box { stroke: var(--accent); }
  a:hover .link { text-decoration: underline; }
  .link { fill: var(--accent) !important; }
  .grp { fill: #fff; stroke: #d1d5db; stroke-width: 1.25; }
  .tag { font-size: 12px; font-weight: 600; letter-spacing: .1em; fill: var(--muted); }
  .ic { color: var(--ink); fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ic-k { stroke-width: 2.2; }
  a:hover .ic { color: var(--accent); }
  .nl { font-size: 14px; font-weight: 500; }
  .nl.k { font-weight: 700; }
  .ns { font-size: 12.5px; fill: var(--muted); }
  .el { font-size: 12.5px; fill: #374151; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
  /* suite */
  .bnd { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 7 5; }
  .dash { stroke-dasharray: 6 5; }
  .rule { stroke: #d1d5db; stroke-width: 1; }
  .kk { font-size: 11px; font-weight: 600; fill: var(--muted); }
  .col-t { font-size: 13px; }
  /* /suite */
  @media print { nav { display: none; } section { display: block; page-break-after: always; } }
</style>

      <circle cx="0" cy="12" r="11" class="dot"/><text x="0" y="16" class="dot-t" text-anchor="middle">1</text>
      <text x="24" y="18" class="tl">Public data becomes patrol zones</text>
      <text x="24" y="42" class="b">King County beach and water-quality sites are grouped into hot spots,</text>
      <text x="24" y="60" class="b">then the lake is split into one zone per drone.</text>
    </g>

      <circle cx="0" cy="12" r="11" class="dot"/><text x="0" y="16" class="dot-t" text-anchor="middle">2</text>
      <text x="24" y="18" class="tl">Each drone flies its zone</text>
      <text x="24" y="42" class="b">ArduPilot follows the waypoint loop. The pilot can take over</text>
      <text x="24" y="60" class="b">with the RC transmitter at any time.</text>
    </g>
    <a href="#drone"><g transform="translate(0,184)">
      <circle cx="0" cy="12" r="11" class="dot acc"/><text x="0" y="16" class="dot-t" text-anchor="middle">3</text>
      <text x="24" y="18" class="tl">The thermal camera spots a swimmer</text>
      <text x="24" y="42" class="b">The Raspberry Pi finds a warm spot that lasts three frames and sends</text>
      <text x="24" y="60" class="b">a signed alert with the drone's GPS position. <tspan class="link">Drone flowchart →</tspan></text>
    </g></a>
    <g transform="translate(0,276)">
      <circle cx="0" cy="12" r="11" class="dot"/><text x="0" y="16" class="dot-t" text-anchor="middle">4</text>
      <text x="24" y="18" class="tl">The server checks the alert</text>
      <text x="24" y="42" class="b">It verifies the drone's signature, saves the alert, and pushes it</text>
      <text x="24" y="60" class="b">to the dashboard right away.</text>
    </g>

      <circle cx="0" cy="12" r="11" class="dot"/><text x="0" y="16" class="dot-t" text-anchor="middle">5</text>
      <text x="24" y="18" class="tl">A responder decides what to do</text>
      <text x="24" y="42" class="b">The dashboard plays a sound and pins the location. The responder</text>
      <text x="24" y="60" class="b">keeps watching or sends the drones home. <tspan class="link">Operator flowchart →</tspan></text>
    </g></a>
    <g transform="translate(0,460)">
      <circle cx="0" cy="12" r="11" class="dot"/><text x="0" y="16" class="dot-t" text-anchor="middle">6</text>

<script>
  const views = ["arch", "arch2", "context", "deploy", "dfd", "states", "erd", "usecases", "map", "layers", "sequence", "drone", "operator"];
  const params = new URLSearchParams(location.search);
  if (params.has("export")) document.body.classList.add("export");
  function show(id) {
    const view = views.includes(id) ? id : "arch";
    for (const s of document.querySelectorAll("main > section")) s.classList.toggle("on", s.id === view);
    for (const a of document.querySelectorAll("nav a")) {
      if (a.getAttribute("href") === "#" + view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    }
    window.scrollTo(0, 0);
  }
  // Handle in-page links here so they also work where the URL hash can't change (previews, some file viewers).
  document.addEventListener("click", (event) => {
    const link = event.target.closest("a");
    const href = link && link.getAttribute("href");
    if (!href || !href.startsWith("#")) return;
    event.preventDefault();
    show(href.slice(1));
    try { history.replaceState(null, "", href); } catch (_) { /* opaque origins refuse; the view still switches */ }
  });
  addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(params.get("export") || location.hash.slice(1));
</script>
